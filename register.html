<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد - Edu4U</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>

    <!-- أيقونات اللغة والوضع -->
    <div class="top-icons">
        <img src="icons/planet.png" alt="لغة" id="lang-toggle" class="lang-icon">
        <img src="icons/moon.png" alt="الوضع الليلي" id="theme-toggle" class="theme-icon">
    </div>

    <div class="main-split-container">
        <div class="welcome-text-panel">
            <h1 id="welcome-title">"مرحباً بك في منصة التعليم لأجلك</h1>
            
            <div class="feature-box">
                <h3 id="feature1-title">جاهز للبدء</h3>
                <p id="feature1-text">ابدأ رحلتك التعليمية معنا واحصل على أفضل المهارات.</p>
            </div>
            
            <div class="feature-box">
                <h3 id="feature2-title">وفر وقتك</h3>
                <p id="feature2-text">تعلم في أي وقت ومن أي مكان بسهولة وراحة.</p>
            </div>
        </div>

        <div class="login-container">
            <h2 id="register-title">إنشاء حساب</h2>
            <form action="register_logic.php" method="POST">
                
                <div class="input-group">
                    <label for="username" id="username-label">الاسم كاملاً</label>
                    <input type="text" id="username" name="username" required placeholder="Your Name">
                </div>

                <div class="input-group">
                    <label for="email" id="email-label">البريد الإلكتروني</label>
                    <input type="email" id="email" name="email" required placeholder="example@email.com">
                </div>

                <div class="input-group">
                    <label for="password" id="password-label">كلمة المرور</label>
                    <input type="password" id="password" name="password" required placeholder="********">
                </div>
                
                <div class="input-group">
                    <label for="confirm_password" id="confirm-password-label">تأكيد كلمة المرور</label>
                    <input type="password" id="confirm_password" name="confirm_password" required placeholder="********">
                </div>

                <button type="submit" class="login-btn" id="register-btn">سجل الآن</button>
                
                <p class="register-link" id="login-text">لديك حساب بالفعل؟ <a href="login.html" id="login-link">تسجيل الدخول</a></p>
            </form>
        </div>
    </div>

    <script src="register.js"></script>
</body>
</html>
