<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-lang="acc-profile">حسابي | Edu4U</title>
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="profile.css"> <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <div class="navbar-logo">
            <span class="logo-text">Edu4U</span>
        </div>

        <ul class="nav-links">
            <li><a href="home.html" data-lang="nav-home">الرئيسية</a></li>
            <li><a href="my_courses.html" data-lang="nav-mycourses">كورساتي</a></li>
            <li><a href="courses.html" data-lang="nav-courses">جميع الكورسات</a></li> 
            <li><a href="calculator.html" data-lang="nav-calc">الحاسبة</a></li>
        </ul>

        <div class="nav-icons-group">
            <div class="account-dropdown active-link">
                <button class="nav-icon-btn account-btn active-link" title="Account">
                    <i class="fas fa-user-circle"></i> 
                </button>
                <div class="dropdown-content show">
                    <a href="profile.html" data-lang="acc-profile" class="active">حسابي</a>
                    <a href="login.html" data-lang="acc-logout">تسجيل الخروج</a>
                </div>
            </div>
            <button id="lang-toggle" class="nav-icon-btn" title="Change Language">
                <i class="fas fa-globe"></i>
            </button>
            <button id="theme-toggle" class="nav-icon-btn" title="Toggle Light/Dark Mode">
                <img id="theme-img" src="icons/moon.png" alt="theme">
            </button>
        </div>
    </nav>
    <main class="profile-content">
        <div class="profile-card">
            <h1 data-lang="profile-settings-title">إعدادات الحساب</h1>
            
            <section class="section-container">
                <h2 data-lang="profile-info-title">تغيير معلوماتك الشخصية</h2>
                <form id="info-form">
                    <div class="input-group">
                        <label for="username" data-lang="profile-label-name">الاسم الكامل:</label>
                        <input type="text" id="username" value="اسم المستخدم الحالي" required>
                    </div>
                    <div class="input-group">
                        <label for="email" data-lang="profile-label-email">البريد الإلكتروني:</label>
                        <input type="email" id="email" value="user@example.com" required>
                    </div>
                    <button type="submit" class="save-btn" data-lang="profile-save-info">حفظ التغييرات</button>
                </form>
            </section>
            
            <hr>
            <section class="section-container">
                <h2 data-lang="profile-password-title">تغيير كلمة المرور</h2>
                <form id="password-form">
                    <div class="input-group">
                        <label for="current-password" data-lang="profile-label-current-pass">كلمة المرور الحالية:</label>
                        <input type="password" id="current-password" required>
                    </div>
                    <div class="input-group">
                        <label for="new-password" data-lang="profile-label-new-pass">كلمة المرور الجديدة:</label>
                        <input type="password" id="new-password" required>
                    </div>
                    <div class="input-group">
                        <label for="confirm-password" data-lang="profile-label-confirm-pass">تأكيد كلمة المرور الجديدة:</label>
                        <input type="password" id="confirm-password" required>
                    </div>
                    <button type="submit" class="save-btn password-btn" data-lang="profile-change-pass">تغيير كلمة المرور</button>
                </form>
            </section>
        </div>
    </main>

    <script src="home.js"></script>
</body>
</html>
