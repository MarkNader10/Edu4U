<!DOCTYPE html>
<html lang="ar" dir="rtl"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edu4U Calculator</title>
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="calculator.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <div class="navbar-logo">
            <span class="logo-text"></span>
        </div>

        <ul class="nav-links">
    <li><a href="home.html" data-lang="nav-home">الرئيسية</a></li>
    <li><a href="my_courses.html" data-lang="nav-mycourses">كورساتي</a></li>
    <li><a href="courses.html" data-lang="nav-courses">جميع الكورسات</a></li>
    <li><a href="calculator.html" class="active" data-lang="nav-calc">الحاسبة</a></li>
        </ul>

        <div class="nav-icons-group">
            <div class="account-dropdown">
                <button class="nav-icon-btn account-btn" title="Account">
                    <i class="fas fa-user-circle"></i> 
                </button>
                <div class="dropdown-content">
                    <a href="profile.html" data-lang="acc-profile">حسابي</a>
                    <a href="login.html" data-lang="acc-logout">تسجيل الخروج</a>
                </div>
            </div>

            <button id="lang-toggle" class="nav-icon-btn" title="Change Language">
                <i class="fas fa-globe"></i>
            </button>

            <button id="theme-toggle" class="nav-icon-btn" title="Toggle Light/Dark Mode">
                <img id="theme-img" src="icons/moon.png">
            </button>
        </div>
    </nav>
 <main class="calc-content-area">
    <div class="calculator">
        <input type="text" id="display" disabled value="0">
        
        
        <div class="buttons">
            <button class="btn clear">C</button>
            <button class="btn function" data-op="root">√</button> 
            <button class="btn operator" data-op="power">x^y</button> 
            <button class="btn operator">/</button>
            
            <button class="btn">7</button>
            <button class="btn">8</button>
            <button class="btn">9</button>
            <button class="btn operator">*</button>

            <button class="btn">4</button>
            <button class="btn">5</button>
            <button class="btn">6</button>
            <button class="btn operator">-</button>

            <button class="btn">1</button>
            <button class="btn">2</button>
            <button class="btn">3</button>
            <button class="btn operator">+</button>

            <button class="btn" style="grid-column: span 2;">0</button>
            <button class="btn">.</button>
            <button class="btn equals">=</button>
        </div>
    </div>
</main>

    <script src="home.js"></script>
    <script src="calculator.js"></script>
</body>
</html>
